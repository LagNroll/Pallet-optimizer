<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pallet-optimizer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Pallet-optimizer</h1>

  <section class="card">
    <h2>1. Pallet size</h2>
    <div class="row">
      <label for="palletLength">Length (mm)</label>
      <input type="number" id="palletLength" min="1" value="1200">
    </div>
    <div class="row">
      <label for="palletWidth">Width (mm)</label>
      <input type="number" id="palletWidth" min="1" value="800">
    </div>
  </section>

  <section class="card">
    <h2>2. Limits</h2>
    <div class="row">
      <label for="maxHeight">Max height (mm)</label>
      <input type="number" id="maxHeight" min="1" value="1250">
    </div>
    <div class="row">
      <label for="maxWeight">Max weight (kg)</label>
      <input type="number" id="maxWeight" min="1" value="450">
    </div>
  </section>

  <button id="saveBtn">Save</button>
  <p id="message"></p>

  <section class="card summary">
    <h2>Current settings</h2>
    <pre id="summary"></pre>
  </section>

  <script src="script.js"></script>
</body>
</html>
